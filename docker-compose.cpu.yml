# Without a GPU: vLLM's CPU build instead. Use both files:
#   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d
# CPU_CORES (.env): the CPUs it may use, e.g. 0-1 (two cores) or 0-11; all of them by default.
# Expect ~0.5-2 s a request instead of ~0.1 s (README "Results").
services:
  vllm:
    image: vllm/vllm-openai-cpu:v0.31.0
    deploy: !reset {}
    cpuset: ${CPU_CORES:-}
    environment:
      PYTHONPATH: /plugin
      VLLM_CPU_KVCACHE_SPACE: "2"
      VLLM_CPU_OMP_THREADS_BIND: ${CPU_CORES:-auto}
    command: >-
      --model ${ASR_MODEL:-Qwen/Qwen3-ASR-1.7B} --served-model-name qwen3-asr
      --max-model-len 4096 --logits-processors asr_bias:AsrBias
